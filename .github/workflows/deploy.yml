name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # LINT & TYPE CHECK
  # ─────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # ruff and mypy live in the `lint` extra, not `dev` — installing only
        # `dev` left both steps below running whatever happened to be on the
        # runner image.
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,lint]

      - name: Run ruff linter
        run: ruff check .

      - name: Run type checks
        # Not gating yet (strict mode still reports missing annotations across
        # the suite), but it must at least *run*: it previously aborted on a
        # duplicate-module error before checking a single file, so nothing was
        # ever type-checked here.
        run: mypy . || true

  # ─────────────────────────────────────────────────────────────
  # TESTS
  # ─────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector's image, not stock postgres: migration 010 creates the
        # vector extension and the job_embeddings table, and `alembic upgrade
        # head` runs below. On stock postgres the extension is unavailable,
        # the migration skips the table, and nothing here would catch a
        # regression in it.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: talentRadar
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: talentradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # There is no `test` extra; the test tooling is all in `dev`.
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: talentradar_test
          # Alembic's env.py loads the same Settings as the app, and both of
          # these are required with no default — without them the migration
          # step fails at import, before it reaches the database.
          GROQ_API_KEY: test_key
          JWT_SECRET_KEY: ci_secret_key_at_least_32_characters_long
        run: alembic upgrade head

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: talentradar_test
          GROQ_API_KEY: test_key
          TAVILY_API_KEY: test_key
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────
  # BUILD & PUSH DOCKER IMAGE
  # ─────────────────────────────────────────────────────────────
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────────────────────
  # DEPLOY
  # ─────────────────────────────────────────────────────────────
  # The Cloud Run job that used to live here deployed, on every push to main,
  # a service with minScale: "1" and CPU throttling disabled — an always-on
  # billed instance — pointing CHROMA_HOST at a container that did not exist
  # there. It is gone, along with infra/cloudrun.yaml.
  #
  # The deployment target is now Render (see render.yaml and DEPLOY.md),
  # which builds from this repository itself and redeploys on push. This job
  # only nudges it, and only when a deploy hook is configured: create the
  # service from the blueprint, copy its deploy hook URL into the
  # RENDER_DEPLOY_HOOK_URL repository secret, and this becomes a no-op
  # confirmation step. Without the secret it is skipped, so the workflow
  # stays green on a fork that deploys somewhere else entirely.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # The `secrets` context is not available in an `if:` expression, so the
    # hook is mapped into `env` first and the steps branch on that.
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Note when no deploy hook is configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "No RENDER_DEPLOY_HOOK_URL secret set — nothing was deployed."
          echo "The image was pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}."
          echo "See DEPLOY.md for the one-time Render + Neon setup."
