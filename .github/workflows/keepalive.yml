# ─────────────────────────────────────────────────────────────────────────────
# Keep the free Render instance awake
# ─────────────────────────────────────────────────────────────────────────────
# Render's free plan spins a web service down after 15 minutes with no traffic,
# and the next request then pays a ~40 second cold start. A periodic request
# keeps it resident.
#
# Two things this deliberately does *not* do:
#
#   * It pings /health, which touches nothing. Any endpoint that queried
#     Postgres would also wake Neon's compute on every tick, and Neon's free
#     plan bills compute hours — you would trade a Render limit for a Neon one.
#   * It does not run every 5 minutes. Render's free plan allows 750 instance
#     hours a month across all free services; a month is ~730 hours, so one
#     always-on service just fits and a second one does not. If the blueprint's
#     `talentradar-web` service is still running, suspend it or this will run
#     out partway through the month.
#
# GitHub's scheduled runs are best-effort: a ten-minute cron actually fired
# every 2-9 hours, so a run that pinged once and exited left the instance
# asleep nearly all day. A run therefore *stays* for most of the six hours a
# job is allowed, pinging every ten minutes, and starts its own successor as it
# finishes. The schedule is now only the safety net that restarts the chain if
# a run is ever lost; it no longer has to be on time.
#
# This is free because the repository is public (Actions minutes are not
# metered). On a private repository it would use ~43,000 minutes a month - move
# the ping to an external monitor (cron-job.org, UptimeRobot) before making the
# repository private.
#
# The ping tolerates a slow wake (scripts/keepalive.sh, tested in
# tests/test_keepalive_script.py). The old step failed with curl exit 28 when
# Render took longer than three 90-second attempts, turning a slow wake into a
# red run.
# ─────────────────────────────────────────────────────────────────────────────

name: keepalive

on:
  schedule:
    # Safety net only - see above. Off the top of the hour, when GitHub's
    # scheduler is least congested.
    - cron: "7 */3 * * *"
  workflow_dispatch: {}

# One holder at a time. A run that arrives while another is holding waits for
# it rather than cancelling it, and takes over when it ends.
concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to start the next run in the chain

jobs:
  ping:
    runs-on: ubuntu-latest
    # A job may run for six hours. Hold for 5h40m and leave the rest for a
    # slow final wake and the hand-over.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/keepalive.sh
          sparse-checkout-cone-mode: false

      - name: Keep the API awake
        env:
          # Override in repo Settings -> Variables if the service is renamed.
          URL: ${{ vars.KEEPALIVE_URL || 'https://talentradar-api.onrender.com/health' }}
          DEADLINE_SECONDS: "480"
          HOLD_SECONDS: "20400"
          # Render sleeps after 15 idle minutes; ten leaves room for a slow ping.
          INTERVAL_SECONDS: "600"
        run: |
          end=$(( $(date +%s) + HOLD_SECONDS ))
          last=0
          while :; do
            bash scripts/keepalive.sh && last=0 || last=$?
            [ "$(date +%s)" -ge "$end" ] && break
            sleep "$INTERVAL_SECONDS"
          done
          # One missed ping mid-run is a blip; a service still down at the end
          # of the hold is worth a red run.
          exit "$last"

      - name: Hand over to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A scheduled run may already be waiting behind this one; starting
          # another would only cancel it.
          waiting=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow keepalive.yml             --json status -q '[.[] | select(.status == "pending" or .status == "queued")] | length')
          if [ "${waiting:-0}" -eq 0 ]; then
            gh workflow run keepalive.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          fi
