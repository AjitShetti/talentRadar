[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ===========================================================================
# Project metadata
# ===========================================================================
[project]
name = "talentRadar"
version = "0.1.0"
description = "A multi-agent job-intelligence platform that ingests job postings, extracts structured signals via LLMs, and answers natural-language queries using RAG."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "TalentRadar Contributors" },
]
keywords = ["job-intelligence", "rag", "langgraph", "fastapi", "airflow", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

# ===========================================================================
# Core dependencies (required to run the application)
# ===========================================================================
dependencies = [
    # --- FastAPI & web framework ---
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",

    # --- Pydantic & settings ---
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "email-validator>=2.1.0",  # required by Pydantic for HTTPBearer
    "sse-starlette>=2.0.0,<3.0.0",

    # --- SQLAlchemy & database drivers ---
    "sqlalchemy>=2.0.30,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",           # async PostgreSQL driver
    "psycopg2-binary>=2.9.9,<3.0.0",    # sync driver for Alembic migrations
    "alembic>=1.13.0,<2.0.0",

    # --- LangGraph & LLM orchestration ---
    "langgraph>=0.2.0,<1.0.0",
    "langchain>=0.3.0,<1.0.0",
    "langchain-openai>=0.2.0,<1.0.0",  # Groq uses OpenAI-compatible API
    "langchain-core>=0.3.0,<1.0.0",

    # --- LLM API client ---
    "groq>=0.9.0,<1.0.0",

    # --- Document parsing & PDF rendering ---
    "python-docx>=1.1.0",
    # PyMuPDF reads uploaded resumes *and*, since the vector store moved to
    # pgvector, renders the resume PDF when there is no TeX Live install —
    # see api/utils/pdf_renderer.py.
    "pymupdf>=1.23.0",

    # --- Embeddings ---
    # chromadb is here for its embedding function only: DefaultEmbeddingFunction
    # is all-MiniLM-L6-v2 under ONNX Runtime, with no PyTorch behind it. The
    # Chroma *server* is no longer part of the deployment — embeddings live in
    # Postgres via pgvector (VECTOR_BACKEND=pgvector, the default), and the
    # ChromaJobStore backend remains only for self-hosted installs that
    # already run one.
    "chromadb>=0.5.0,<1.0.0",

    # --- Search & scraping (ingestion) ---
    # Note: scrapling and its TLS-impersonation fetcher are in the [stealth]
    # extra, not here — `scrapling.fetchers` imports playwright *and*
    # patchright at module level, so it cannot be installed without the
    # browser stack. ingestion/scrapling_manager.py already treats it as
    # optional and falls back to httpx with browser-like headers.
    # TLS/HTTP2 browser impersonation (~5 MB). This is the tier that gets
    # past the Cloudflare bot check on Indeed India and Instahyre: measured,
    # plain httpx gets 403 + a JS challenge and this gets 200 with the
    # listings. It is scrapling's impersonation engine, taken directly -
    # scrapling itself stays out because `scrapling.fetchers` imports
    # playwright and patchright at module level, which is ~300 MB of browser
    # stack a 512 MB instance cannot run anyway. See
    # ingestion/scrapling_manager.py.
    "curl-cffi>=0.7.0",
    "tavily-python>=0.5.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "httpx>=0.27.0,<1.0.0",
    "lxml>=5.2.0,<7.0.0",

    # --- Authentication & security ---
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",

    # --- Task queue & caching ---
    "redis>=5.0.0,<6.0.0",
    "apscheduler>=3.10.0,<4.0.0",  # in-process cron for the daily job-match scan

    # --- Numerics (used directly by ml/scorers.py) ---
    "numpy>=1.26.0,<2.0.0",

    # --- Logging & observability ---
    "structlog>=24.1.0,<25.0.0",
    "prometheus-client>=0.20.0,<1.0.0",

    # --- Rate limiting ---
    "slowapi>=0.1.9,<1.0.0",

    # --- Environment & config ---
    "python-dotenv>=1.0.1,<2.0.0",

    # --- HTML/text processing ---
    "html2text>=2024.2.0",

    # --- Utilities ---
    "tenacity>=8.3.0,<9.0.0",  # retry decorator
    "python-dateutil>=2.9.0",
]

# ===========================================================================
# Development dependencies (testing, linting, tooling)
# ===========================================================================
[project.optional-dependencies]

# ---------------------------------------------------------------------------
# Deployment-weight extras
# ---------------------------------------------------------------------------
# These were core dependencies until the free-tier deploy work. Each one is
# either large enough to price the image out of a free build tier, or unused
# by any import path. Nothing in the default install depends on them, and the
# code paths that can use them degrade cleanly when they are absent.

# --- Semantic scoring via PyTorch (~1 GB installed) ---
# ml/scorers.py's SemanticScorer prefers sentence-transformers and falls back
# to the same all-MiniLM-L6-v2 weights under ONNX Runtime when it is missing:
# same model, same scores, no torch. Install this only if you specifically
# want the torch implementation.
semantic = [
    "sentence-transformers>=3.0.0,<4.0.0",
    "torch>=2.3.0,<3.0.0",
]

# --- Browser-driven scraping (~300 MB, plus a Firefox download) ---
# The whole impersonation stack, which is one unit whether you want the
# browser or not: `scrapling.fetchers` imports both playwright and patchright
# at module level, so its TLS/HTTP2 impersonation tier cannot be had without
# them. Camoufox on top launches a real headless Firefox per call, which OOMs
# a 512 MB instance, and the sources it reaches (Naukri, Indeed India,
# Instahyre) forbid that in their terms.
#
# Without this extra, ingestion/scrapling_manager.py falls back to httpx with
# browser-like headers — fine for the ATS JSON APIs and static boards, weaker
# against Cloudflare-protected ones. The Camoufox tier is *additionally*
# gated by ENABLE_STEALTH_SCRAPERS, which defaults to false: installing this
# extra alone does not switch the headless browser on.
stealth = [
    "scrapling>=0.3.0",
    "playwright>=1.40.0",
    "patchright>=1.60.0",
    "camoufox>=0.5.0",
]

# --- Declared but never imported ---
# Kept installable so nothing that referenced them breaks, but out of the
# default install: `grep -r` finds these only inside skill-taxonomy string
# lists, never in an import.
unused = [
    "google-cloud-storage>=2.17.0,<3.0.0",
    "xgboost>=2.1.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "duckduckgo-search>=5.0.0",
]

# --- Testing ---
dev = [
    # Test framework
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-xdist>=3.6.0",           # parallel test execution

    # Test utilities
    "pytest-mock>=3.14.0",
    "faker>=26.0.0",                 # synthetic test data
    "factory-boy>=3.3.0",            # test fixtures

    # HTTP test client
    "httpx>=0.27.0",

    # RAG evaluation
    "ragas>=0.1.0,<1.0.0",
    "datasets>=2.20.0",

    # Database test fixtures
    "pytest-postgresql>=6.0.0",      # spinning up test PostgreSQL instances
    "testcontainers[postgresql]>=4.0.0",
    "aiosqlite>=0.20.0",
]

# --- Linting & type checking ---
lint = [
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "types-python-jose>=3.3.0",
    "types-passlib>=1.7.0",
    "types-redis>=4.6.0",
    "types-python-dateutil>=2.9.0",
    "pre-commit>=3.7.0",
]

# NOTE: ruff already provides code formatting (ruff format); black and isort
# are redundant here and conflict with ruff's formatter in pre-commit.
# They have been removed. Use `ruff format .` to format the codebase.

# --- Documentation ---
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

# --- Apache Airflow (optional — heavy: ~400 MB, 200+ transitive deps) ---
# Install with: pip install talentRadar[airflow]
# airflow = [
#     "apache-airflow>=3.0.0.dev0", # updated to allow newer sqlalchemy
#     "apache-airflow-providers-http>=4.0.0",
# ]

# --- All development deps combined ---
all = [
    "talentRadar[dev,lint,docs,semantic,stealth]",
]

# ===========================================================================
# Tool configurations
# ===========================================================================

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services (DB, API)",
    "rag_eval: marks RAG evaluation tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
]
ignore = [
    "ANN101",  # missing type annotation for `self`
    "ANN102",  # missing type annotation for `cls`
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function call in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "api", "config", "ingestion", "ml", "storage", "tests"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "fitz.*",          # PyMuPDF ships no py.typed marker
    "camoufox.*",      # optional [stealth] extra — absent in a default install
    "scrapling.*",
    "tavily.*",
    "ragas.*",
    "slowapi.*",
    "structlog.*",
    "sentence_transformers.*",
    "apache_airflow.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
fail_under = 70
show_missing = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | __pycache__
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "__pycache__", "migrations"]
known_first_party = ["agents", "api", "config", "ingestion", "ml", "storage"]

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "config", "ingestion", "ml", "storage"]

# ===========================================================================
# Entry points / CLI commands
# ===========================================================================
[project.scripts]
talentradar = "api.main:main"

# ===========================================================================
# UV / pip resolution hints (optional, for faster installs)
# ===========================================================================
[tool.uv]
# Removed prefer-binary to fix uv parsing error
