services:
  # ─────────────────────────────────────────────────────────────────────────────
  # DATA LAYER
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    # pgvector's image, not stock postgres: job embeddings live in this
    # database now (migration 010) rather than in a ChromaDB container, and
    # `CREATE EXTENSION vector` needs the extension to be installed. Same
    # PostgreSQL 15 data directory, so an existing volume keeps working.
    image: pgvector/pgvector:pg15
    container_name: talentradar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentRadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-talentRadar}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentRadar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - talentradar-net

  redis:
    image: redis:7-alpine
    container_name: talentradar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - talentradar-net

  # There is no chromadb service any more. Embeddings are rows in the
  # postgres service above (see storage/migrations/versions/010_*), which is
  # what makes a free managed deploy possible: Neon and Supabase both ship
  # pgvector, and neither Chroma Cloud nor a self-hosted Chroma with its
  # persistent volume has a free equivalent. To run the old backend anyway,
  # set VECTOR_BACKEND=chroma and add the service back.

  # ─────────────────────────────────────────────────────────────────────────────
  # APPLICATION LAYER
  # ─────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: talentradar-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: pgvector
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./services:/app/services
      - ./core:/app/core
      - ./domain:/app/domain
      - ./storage:/app/storage
      - ./agents:/app/agents
      - ./config:/app/config
      - ./ingestion:/app/ingestion
      - ./ml:/app/ml
      - ./tests:/app/tests
      - ./data:/app/data          # shared raw JD output dir
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini
    restart: unless-stopped
    networks:
      - talentradar-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentradar-frontend
    ports:
      - "3000:3000"
    environment:
      # Browser-side API URL (used by client components via fetch)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side API URL (used by NextAuth authorize() running inside Docker)
      # Must use the internal Docker service name, not localhost.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-supersecretkey1234567890}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - talentradar-net

volumes:
  postgres_data:
    external: true
    name: talentradar_postgres_data
  redis_data:
    external: true
    name: talentradar_redis_data

networks:
  talentradar-net:
    driver: bridge