services:
  # ─────────────────────────────────────────────────────────────────────────────
  # DATA LAYER
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: talentradar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentRadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-talentRadar}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentRadar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - talentradar-net

  redis:
    image: redis:7-alpine
    container_name: talentradar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - talentradar-net

  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: talentradar-chromadb
    environment:
      CHROMA_SERVER_HTTP_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      ANONYMIZED_TELEMETRY: "False"
      IS_PERSISTENT: "True"
    ports:
      - "8001:8000" # Mapped to 8001 per README table
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    networks:
      - talentradar-net

  # ─────────────────────────────────────────────────────────────────────────────
  # APPLICATION LAYER
  # ─────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: talentradar-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        service_started
      db-seeder:
        condition: service_completed_successfully
    volumes:
      - ./api:/app/api
      - ./services:/app/services
      - ./core:/app/core
      - ./domain:/app/domain
      - ./storage:/app/storage
      - ./agents:/app/agents
      - ./config:/app/config
      - ./ingestion:/app/ingestion
      - ./ml:/app/ml
      - ./tests:/app/tests
      - ./data:/app/data          # shared raw JD output dir
    restart: unless-stopped
    networks:
      - talentradar-net

  celery-worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: talentradar-celery-worker
    command: celery -A ingestion.celery_app worker --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      - postgres
      - redis
      - chromadb
    volumes:
      - ./api:/app/api
      - ./services:/app/services
      - ./core:/app/core
      - ./domain:/app/domain
      - ./storage:/app/storage
      - ./agents:/app/agents
      - ./config:/app/config
      - ./ingestion:/app/ingestion
      - ./ml:/app/ml
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "celery", "-A", "ingestion.celery_app", "inspect", "ping", "--timeout", "10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - talentradar-net

  celery-beat:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: talentradar-celery-beat
    command: celery -A ingestion.celery_app beat --loglevel=info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./ingestion:/app/ingestion
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - talentradar-net

  db-seeder:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: talentradar-db-seeder
    command: python -m ingestion.seed_db
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./api:/app/api
      - ./storage:/app/storage
      - ./config:/app/config
      - ./ingestion:/app/ingestion
      - ./data:/app/data
    networks:
      - talentradar-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentradar-frontend
    ports:
      - "3000:3000"
    environment:
      # Browser-side API URL (used by client components via fetch)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side API URL (used by NextAuth authorize() running inside Docker)
      # Must use the internal Docker service name, not localhost.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-supersecretkey1234567890}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - talentradar-net

volumes:
  postgres_data:
    external: true
    name: talentradar_postgres_data
  redis_data:
    external: true
    name: talentradar_redis_data
  chroma_data:
    external: true
    name: talentradar_chroma_data

networks:
  talentradar-net:
    driver: bridge