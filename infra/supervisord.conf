# ─────────────────────────────────────────────────────────────────────────────
# supervisord.conf — single-container process supervision
# ─────────────────────────────────────────────────────────────────────────────
# Runs the uvicorn web process. Nothing else: this file used to declare
# `celery -A ingestion.celery_app worker` and `... beat`, but there is no
# celery_app module in this repo and celery is not a dependency, so both
# programs crash-looped through their retry budget on every container start
# and filled the logs while the API came up around them.
#
# Ingestion is triggered on demand via POST /api/v1/ingest/trigger or
# scripts/run_ingestion.py; the daily job-match scan runs in-process from
# api/main.py's lifespan (ENABLE_SCHEDULER).
#
# With only one program left this file is optional — the Dockerfile CMD runs
# uvicorn directly. Keep it for hosts that expect a supervisor entrypoint.
# ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:web]
# One worker: see the note in infra/Dockerfile on the per-process state that
# makes additional workers incorrect rather than merely wasteful.
command=sh -c "uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1"
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
