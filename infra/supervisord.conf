# ─────────────────────────────────────────────────────────────────────────────
# supervisord.conf — multi-process container orchestration
# ─────────────────────────────────────────────────────────────────────────────
# Runs uvicorn (web), celery worker, and celery beat in a single container.
# Used by the Docker CMD in local dev or single-container Fly.io deployments.
# ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
user=root

[program:web]
command=uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:worker]
command=celery -A ingestion.celery_app worker --loglevel=info --concurrency=2
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:beat]
command=celery -A ingestion.celery_app beat --loglevel=info
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[group:talentradar]
programs=web,worker,beat
